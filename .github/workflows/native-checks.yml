name: Tinglan native builds
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      mac_arm64:
        description: macOS Apple Silicon DMG
        type: boolean
        default: false
      mac_x64:
        description: macOS Intel DMG
        type: boolean
        default: false
      windows_x64:
        description: Windows x64 installer
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MAC_ARM64: ${{ inputs.mac_arm64 }}
          MAC_X64: ${{ inputs.mac_x64 }}
          WINDOWS_X64: ${{ inputs.windows_x64 }}
        run: node native/scripts/ci-targets.mjs
  build:
    if: github.event_name != 'pull_request'
    needs: plan
    name: Build ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Windows C compiler
        id: msys
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Configure Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          $bin = Join-Path $env:MSYS_ROOT "ucrt64/bin"
          $cc = Join-Path $bin "gcc.exe"
          if (!(Test-Path $cc)) { throw "Missing C compiler: $cc" }
          $bin >> $env:GITHUB_PATH
          "CC=$cc" >> $env:GITHUB_ENV
          "CGO_ENABLED=1" >> $env:GITHUB_ENV
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "HWMUSIC_MAKENSIS=C:/Program Files (x86)/NSIS/makensis.exe" >> $env:GITHUB_ENV
      - name: Verify architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e 'if (process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
      - name: Dependencies and license sources
        working-directory: native
        run: go mod download
      - name: Tests
        working-directory: native
        run: go test ./... -count=1 -timeout 180s
      - name: Windows authorization window regression
        if: runner.os == 'Windows'
        working-directory: native
        env:
          HWMUSIC_TEST_BROWSER: '1'
          HWMUSIC_TEST_BROWSER_VISIBLE: '1'
        run: go test ./internal/webauth -run TestSyntheticBrowser -count=1 -v -timeout 120s
      - name: Windows WebView2 authorization regression
        if: runner.os == 'Windows'
        working-directory: native
        env:
          HWMUSIC_TEST_WEBVIEW2: '1'
        run: go test ./internal/webauth -run 'TestWebView|TestSyntheticWebView' -count=1 -v -timeout 240s
      - name: Static checks
        working-directory: native
        run: go vet ./...
      - name: UI checks
        run: npm run test:native:ui
      - name: Package
        run: node native/scripts/package.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Check Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./native/scripts/check-windows-install.ps1
      - name: Upload installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: tinglan-${{ matrix.id }}-unsigned
          path: release/native/${{ matrix.directory }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.id }}
          path: out/native/qa/
          if-no-files-found: ignore
  pr-check:
    name: PR code checks
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Tests and static checks (no package)
        working-directory: native
        run: |
          go test ./... -count=1 -timeout 180s
          go vet ./...
  gate:
    name: Build gate
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [plan, build, pr-check]
    runs-on: ubuntu-latest
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          PR_CHECK: ${{ needs.pr-check.result }}
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            test "$PR_CHECK" = success
          else
            test "$PLAN" = success && test "$BUILD" = success
          fi
  release:
    name: Publish latest
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tinglan-*-unsigned
          path: artifacts
      - name: Verify all three installers
        run: |
          set -euo pipefail
          mkdir release-assets
          for target in macos-arm64 macos-x64 windows-x64; do
            dir="artifacts/tinglan-${target}-unsigned"
            (cd "$dir" && sha256sum --check SHA256SUMS)
            find "$dir" -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} release-assets/ \;
            cat "$dir/SHA256SUMS" >> release-assets/SHA256SUMS
          done
          test "$(find release-assets -type f | wc -l)" -eq 4
      - name: Publish immutable build as latest
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          tag="v${version}-build.${RUN_NUMBER}"
          gh release create "$tag" release-assets/* --target "$COMMIT" \
            --latest --title "听澜 Tinglan ${version} · Build ${RUN_NUMBER}" \
            --notes-file docs/RELEASE_NOTES.md
